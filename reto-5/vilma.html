<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento con Navbar y Formulario</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        header {
            background: #1e3a8a; /* azul */
            padding: 15px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav .logo {
            font-weight: bold;
            font-size: 20px;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* MAIN + FORM */
        main {
            padding: 20px;
        }

        form {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f9f9f9;
        }

        form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        form input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        form button {
            margin-top: 15px;
            padding: 10px 15px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        form button:hover {
            background: #172f6a;
        }
    </style>
</head>
<body>

    <label for="">    Escribe tu nombre   </label>
    <input type="text">
     <label for="">    Escribe tu dni  </label>
    <input type="number">

     <label for="">    soltero  </label>
    <input type="checkbox">

    <button>guard</button>
    










   

</body>
</html>
